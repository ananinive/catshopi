<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catshopi</title>
</head>
<body>
    <h1><img 
        src="https://cdn.phototourl.com/free/2026-08-27-e93e5609-5d3a-486f-ab12-d184c45c6f3b.png" alt="Catshopi">
    </h1> 
    <br>
        <div class="progresso">
        <img 
        src="https://cdn.phototourl.com/free/2026-08-27-74139339-d137-4ccc-a78a-43a455b0132b.png" alt="Etapa 1 de 2">
        <div class="Tracinho"></div>
        <img 
        src="https://cdn.phototourl.com/free/2026-08-27-74139339-d137-4ccc-a78a-43a455b0132b.png" alt="Etapa 2 de 2">
        </div>

        <form action="Tela3.html">

        <p class="balao">Dados do pet</p>

        <p class="balao-diferente">Nome</p>
        <input type="text" id="nome-gato" placeholder="Insira o nome do seu pet" required>

        <p class="balao-diferente">Idade</p>
        <input type="text" id="idade-gato" placeholder="Insira a idade do seu pet" required>

        <p class="balao-diferente">Peso</p>
        <input type="text" id="peso-gato" placeholder="Insira o peso do seu pet" required>

        <p class="balao-diferente">Raça</p>
        <input type="text" id="raca-gato" placeholder="Insira a raça do seu pet" required>

        <p class="balao-diferente">Sexo</p>
        <input type="text" id="sexo-gato" placeholder="Insira o sexo do seu pet" required>

        <p class="balao-diferente">Porte</p>
        <input type="text" id="porte-gato" placeholder="Insira o porte do seu pet" required>
       <br>
       <button type="submit" class="balao_interativo">Prosseguir</button>

</form>
</body>
</html>
